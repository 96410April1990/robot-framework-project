name: "Execute provisioning script on VM after merge"

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  run-provision-script:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Azure VM and run test suite
        uses: appleboy/ssh-action@v1.0.3
        env: 
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE }}
          COSMOS_CONTAINER: ${{ secrets.COSMOS_CONTAINER }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: VM_HOST, VM_USER, VM_KEY, GEMINI_API_KEY, GEMINI_MODEL, SLACK_WEBHOOK_URL, COSMOS_ENDPOINT, COSMOS_KEY, COSMOS_DATABASE, COSMOS_CONTAINER, GITHUB_RUN_ID, GITHUB_SHA, GITHUB_REF_NAME
          debug: false
          script: |
            set -euo pipefail
            export PYTHONUNBUFFERED=1
            cd /home/rohith-azureuser/project
            git pull
            sudo apt-get update
            sudo apt-get install -y default-jre
            if ! command -v allure &> /dev/null; then
                ALLURE_VERSION=2.32.0
                curl -o allure.tgz -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
                sudo tar -zxf allure.tgz -C /opt/
                sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
                rm allure.tgz
            fi
            allure --version
            cat > .env << EOF
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=${GEMINI_MODEL}
            EOF
            chmod 600 .env
            rm -rf venv
            pip install --ignore-installed -r requirements.txt --use-deprecated=legacy-resolver
            export PATH="$HOME/.local/bin:$PATH"
            python3 -m playwright install chromium
            which pytest
            pip list | grep -i pytest
            cd playwright
            # Ensure allure-results is clean before running tests
            rm -rf allure-results || true
            mkdir -p allure-results
            ENV=dev pytest tests/PracticeTestAutomationTests.py --alluredir=allure-results -v 2>&1 || true
            EXECUTION_DATE="$(date -u +%Y-%m-%d)"
            REPORT_ROOT="/home/rohith-azureuser/project/playwright/allure-reports"
            REPORT_PATH="${REPORT_ROOT}/${EXECUTION_DATE}"
            mkdir -p "${REPORT_ROOT}"
            allure generate allure-results --clean -o "${REPORT_PATH}"
            fuser -k 8080/tcp || true
            cd "${REPORT_ROOT}"
            nohup python3 -m http.server 8080 > /dev/null 2>&1 &
            disown
            # run Allure analyzer to produce a JSON summary and post insights to Slack
            cd /home/rohith-azureuser/project || true
            python3 scripts/analyze_allure.py --results-dir playwright/allure-results --post-slack --output-json /tmp/allure_summary.json || true
            export EXECUTION_DATE
            export REPORT_URL="http://${VM_HOST}:8080/${EXECUTION_DATE}"
            export PROJECT_NAME="robot-framework-project"
            python3 scripts/publish_test_summary.py /tmp/allure_summary.json

      - name: Notify Slack with Allure report URL
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification"
            exit 0
          fi
          EXECUTION_DATE="$(date -u +%Y-%m-%d)"
          REPORT_URL="http://${VM_HOST}:8080/${EXECUTION_DATE}"
          if command -v jq >/dev/null 2>&1; then
            payload=$(jq -n --arg text "Allure report available: ${REPORT_URL}" '{text: $text}')
            curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true
          else
            curl -s -X POST -H 'Content-type: application/json' --data "{\"text\": \"Allure report available: ${REPORT_URL}\"}" "$SLACK_WEBHOOK_URL" || true
          fi