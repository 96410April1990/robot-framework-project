name: "Execute provisioning script on VM after merge"

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  run-provision-script:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Azure VM and run test suite
        uses: appleboy/ssh-action@v1.0.3
        env: 
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: VM_HOST, VM_USER, VM_KEY, GEMINI_API_KEY, GEMINI_MODEL
          debug: true
          script: |
            set -euo pipefail
            set -x
            export PYTHONUNBUFFERED=1
            cd /home/rohith-azureuser/project
            #git fetch origin main
            #git checkout main
            #git reset --hard origin/main
            git pull
            cat > .env << EOF
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=${GEMINI_MODEL}
            EOF
            chmod 600 .env
            source venv/bin/activate
            which pytest
            pip list | grep -i pytest
            ENV=dev pytest tests/PracticeTestAutomationTests.py --alluredir=allure-results -v 2>&1 || true
            allure generate allure-results --clean -o allure-report
            cd /home/rohith-azureuser/project/playwright/allure-report
            nohup python3 -m http.server 8080 > /dev/null 2>&1 &
