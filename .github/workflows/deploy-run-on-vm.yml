name: "Execute provisioning script on VM after merge"

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  run-provision-script:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Azure VM and run test suite
        uses: appleboy/ssh-action@v1.0.3
        env: 
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: VM_HOST, VM_USER, VM_KEY, GEMINI_API_KEY, GEMINI_MODEL
          debug: true
          script: |
            set -euo pipefail
            set -x
            export PYTHONUNBUFFERED=1
            cd /home/rohith-azureuser/project
            git pull
            sudo apt-get update
            sudo apt-get install -y default-jre
            if ! command -v allure &> /dev/null; then
                ALLURE_VERSION=2.32.0
                curl -o allure.tgz -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
                sudo tar -zxf allure.tgz -C /opt/
                sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
                rm allure.tgz
            fi
            allure --version
            cat > .env << EOF
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=${GEMINI_MODEL}
            EOF
            chmod 600 .env
            rm -rf venv
            pip install --ignore-installed -r requirements.txt --use-deprecated=legacy-resolver
            export PATH="$HOME/.local/bin:$PATH"
            python3 -m playwright install chromium
            which pytest
            pip list | grep -i pytest
            cd playwright
            ENV=dev pytest tests/PracticeTestAutomationTests.py --alluredir=allure-results -v 2>&1 || true
            allure generate allure-results --clean -o allure-report
            fuser -k 8080/tcp || true
            cd allure-report
            nohup python3 -m http.server 8080 > /dev/null 2>&1 &
            disown

      - name: Notify Slack with Allure report URL
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification"
            exit 0
          fi
          REPORT_URL="http://${VM_HOST}:8080"
          payload=$(jq -n --arg text "Allure report available: ${REPORT_URL}" '{text: $text}')
          # Fallback if jq is not present
          if command -v jq >/dev/null 2>&1; then
            curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true
          else
            curl -s -X POST -H 'Content-type: application/json' --data "{\"text\": \"Allure report available: ${REPORT_URL}\"}" "$SLACK_WEBHOOK_URL" || true
          fi

