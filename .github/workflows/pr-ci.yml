name: PR Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'feature/**'

jobs:
  lint-and-tests:
    name: Lint, Tests & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install flake8 bandit safety pytest PyGithub openai requests

      - name: Run flake8
        run: flake8 || true

      - name: Run bandit (SAST checks)
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Run safety (dependency vulnerability scan)
        run: |
          if [ -f requirements.txt ]; then safety check --file=requirements.txt --json > safety-report.json || true; fi

      - name: Run tests
        run: pytest -q || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            bandit-report.json
            safety-report.json
            ./**/report.xml

  ai-review:
    name: AI Review & Slack Notify
    runs-on: ubuntu-latest
    needs: lint-and-tests
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ai-review dependencies
        run: python -m pip install --upgrade pip && pip install PyGithub openai requests slack-sdk

      - name: Run AI review script
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/ai_review.py
